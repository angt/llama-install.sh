name: Build any rocm

on:
  workflow_call:
    inputs: &common_inputs
      filter:
        type: string
        default: 'rocm'
      deploy:
        type: boolean
      llamacpp_repo:
        type: string
      llamacpp_version:
        type: string
      boringssl_repo:
        type: string
      boringssl_version:
        type: string

  workflow_dispatch:
    inputs: *common_inputs

jobs:
  build:
    runs-on: ${{ contains(inputs.filter, '-windows-') && 'windows-2022' || 'ubuntu-22.04' }}
    env:
      ROCM_VERSION: "7.15.0a20260723"

    steps:
      - uses: actions/checkout@v5

      - name: Setup windows env
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
        if: runner.os == 'Windows'

      - name: Install deps
        run: python scripts/install-rocm.py ${{ inputs.filter }}

      - name: Build ${{ inputs.filter }}
        env:
          LLAMACPP_REPO: ${{ inputs.llamacpp_repo }}
          LLAMACPP_VERSION: ${{ inputs.llamacpp_version }}
          BORINGSSL_REPO: ${{ inputs.boringssl_repo }}
          BORINGSSL_VERSION: ${{ inputs.boringssl_version }}
          HF_TOKEN: ${{ secrets.HF_TOKEN_READ }}
        run: cmake --workflow --preset ${{ inputs.filter }}

      - name: Deploy
        if: ${{ inputs.deploy && vars.HF_REPO != '' }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install -U "hf[hf_xet]"
          python scripts/upload.py ${{ vars.HF_REPO }}/${{ inputs.llamacpp_version || 'test' }}
